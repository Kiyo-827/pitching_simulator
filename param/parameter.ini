[parameters]

# ============================================================
# Physical properties
# ============================================================

# Gravitational acceleration [m/s^2]
gravity = 9.80665

# Air density [kg/m^3]
# Reserved for aerodynamic-force models.
air_density = 1.225

# Ball density [kg/m^3]
ball_density = 700.0

# Ball diameter [mm]
# Only one float value is specified.
ball_sizes_mm = 73.0


# ============================================================
# Aerodynamic coefficients
# ============================================================

# Drag coefficient [-]
# Reserved for future implementation.
drag_coefficient = 0.35

# Magnus coefficient [-]
# Reserved for future implementation.
magnus_coefficient = 0.20


# ============================================================
# Initial conditions
# ============================================================

# Initial position [m]
#
# Coordinate system:
#   x : horizontal direction
#       positive = pitcher's right
#
#   y : pitching direction
#       positive = pitcher -> catcher
#
#   z : vertical direction
#       positive = upward
#
# Format:
#   [x, y, z]
#
initial_position = [0.0, 0.0, 1.80]


# Initial speed vector [m/s]
#
# The magnitude of this vector is used as the scalar
# initial speed.
#
# Example:
#   [35.0, 0.0, 0.0]
#
# gives:
#   initial speed = 35 m/s
#
initial_speed = [35.0, 0.0, 0.0]


# Initial direction vector
#
# This vector is normalized internally.
#
# Example:
#   [0.0, 1.0, 0.0]
#       straight toward the catcher
#
#   [0.0, 1.0, 0.03]
#       slightly upward
#
#   [0.03, 1.0, 0.03]
#       pitcher's right and slightly upward
#
initial_direction = [0.0, 1.0, 0.03]


# ============================================================
# Angular velocity
# ============================================================

# Angular velocity [rad/s]
#
# Format:
#   [omega_x, omega_y, omega_z]
#
# omega_x : rotation about x axis
# omega_y : rotation about y axis
# omega_z : rotation about z axis
#
# Reserved for Magnus-force and seam-force models.
angular_velocity = [10.0, 10.0, 10.0]


# ============================================================
# Numerical settings
# ============================================================

# Time step [s]
dt = 0.001

# Maximum calculation time [s]
max_time = 2.0

# Home plate position along the y axis [m]
target_y = 18.44